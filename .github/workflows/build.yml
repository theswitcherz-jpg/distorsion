name: Build SPCTRL-D (Windows VST3)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone -q --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -S . -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SPCTRL-D-VST3-Windows
          path: build/SPCTRL_D_artefacts/Release/VST3/SPCTRL-D.vst3
          if-no-files-found: error
